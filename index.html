<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Quiz – Dynamics Lab</title>
<meta name="robots" content="noindex">
<style>
:root{
  --blue:#0b6bcb; --navy:#0a2a5c; --ink:#14213d; --muted:#5b6b82; --line:#dfe6f0;
  --bg:#f5f8fc; --card:#fff; --ok:#16794c; --okbg:#e7f6ee; --bad:#b42318; --badbg:#fdecea;
  --warn:#8a6100; --warnbg:#fff7e0;
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue)}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--blue);color:var(--blue);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-decoration:none}
.backbtn:hover{background:var(--blue);color:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);text-decoration:none}
.brand i{width:18px;height:18px;border:3px solid var(--blue);border-radius:50%;display:inline-block}
.hero{background:linear-gradient(100deg,#062a63,#0b6bcb 60%,#16a3a0);color:#fff}
.hero .in{max-width:860px;margin:0 auto;padding:22px 16px}
.crumbs{font-size:13px;opacity:.9}
.crumbs a{color:#fff}
.hero h1{margin:6px 0 0;font-size:28px}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:11px 22px;font:600 15px system-ui,sans-serif;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 20px;padding:0;list-style:none}
.facts li{background:#eef4fc;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--navy)}
.note{background:var(--warnbg);border-left:4px solid #e3b23c;border-radius:10px;padding:12px 16px;font-size:14px;margin-top:18px}
/* quiz */
.bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;box-shadow:0 4px 14px rgba(10,42,92,.06)}
.timer{font:700 20px ui-monospace,Consolas,monospace;color:var(--navy)}
.timer.low{color:var(--bad)}
.progress{height:6px;background:#e7edf5;border-radius:6px;overflow:hidden;margin-top:6px;width:180px}
.progress span{display:block;height:100%;background:var(--blue)}
.qnum{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.qtext{font-size:19px;font-weight:650;margin:6px 0 16px}
.multi{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#a9c4e6}
.opt.sel{border-color:var(--blue);background:#eef5fd}
.opt input{margin-top:4px;accent-color:var(--blue)}
.opt b{min-width:18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.gridwrap{display:flex;align-items:center;gap:8px;margin-top:18px}
.grid{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1;padding:3px}
.grid::-webkit-scrollbar{display:none}
.arrow{flex:0 0 36px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font:700 18px/1 system-ui;cursor:pointer;display:grid;place-items:center}
.arrow:hover{background:#eef5fd}
.arrow:disabled{opacity:.3;cursor:default;background:#fff}
.grid button{flex:0 0 36px;width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer;color:var(--ink)}
.grid button.done{background:#dbe9fb;border-color:#a9c4e6}
.grid button.cur{border-color:var(--blue);outline:2px solid var(--blue)}
/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font:800 28px system-ui;color:var(--navy)}
.ring span{background:#fff;width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:8px;margin:22px 0 12px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.res{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.res.bad{border-left-color:var(--bad)}
.res h3{font-size:16px;margin:4px 0 8px}
.res ul{margin:6px 0;padding-left:0;list-style:none}
.res li{padding:3px 8px;border-radius:6px;margin:2px 0;font-size:15px}
.res li.right{background:var(--okbg);color:var(--ok);font-weight:600}
.res li.wrong{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.res .exp{font-size:14px;color:var(--muted);margin-top:8px}
.center{text-align:center}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:14px 16px}
.adm label{display:block;font-weight:600;margin:14px 0 4px}
.adm textarea,.adm select,.adm input[type=text],.srch{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin-top:6px}
.adm .lbl{font-weight:600;margin:16px 0 4px}
.adm .ans{display:flex;align-items:center;gap:10px;margin:8px 0}
.adm .ans input[type=text]{margin:0}
.adm .ck{display:flex;align-items:center;gap:4px;margin:0;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
.adm .ck input{accent-color:var(--ok);width:18px;height:18px}
.adm .btn{margin-top:16px}
p.ok{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 14px;font-weight:600}
p.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 14px}
.srch{margin:14px 0 6px}
.qlist{padding-left:22px;color:var(--ink)} .qlist li{margin:10px 0;font-size:15px}
.opt.right{border-color:#5fbf8f;background:var(--okbg)}
.opt.wrong{border-color:#e59a92;background:var(--badbg)}
.fb{border-radius:12px;padding:12px 16px;margin-top:6px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.bad{background:var(--badbg);color:var(--bad)}
.fb div{color:var(--ink)}
.grid button.ok{background:var(--okbg);border-color:#5fbf8f;color:var(--ok)}
.grid button.no{background:var(--badbg);border-color:#e59a92;color:var(--bad)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.mode{border:1.5px solid var(--line);border-radius:14px;padding:18px}
.mode h3{margin:0 0 4px}
.mode .facts{margin:10px 0 8px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
dialog{border:0;border-radius:16px;padding:22px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,42,92,.35)}
@media (max-width:560px){.hero h1{font-size:23px}.qtext{font-size:17px}.progress{width:110px}.card{padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" id="homeLink" href="https://d365microsoft.wordpress.com/"><i></i>Dynamics Lab</a>
  <a id="backTop" class="backbtn" href="https://d365microsoft.wordpress.com/learn/">← Back to the exam</a>
</div></header>
<section class="hero"><div class="in">
  <div class="crumbs"><a href="https://d365microsoft.wordpress.com/">Home</a> › <a href="https://d365microsoft.wordpress.com/learn/">Microsoft Exams</a> › <a id="crumbExam" href="#">Exam</a></div>
  <h1 id="title">Practice quiz</h1>
</div></section>
<main id="app"><div class="card center muted">Loading questions…</div></main>

<dialog id="confirm">
  <h3 style="margin-top:0">Finish the quiz?</h3>
  <p id="confirmText" class="muted"></p>
  <p class="muted" style="font-size:14px">After you finish, you can't change your answers.</p>
  <div class="nav"><button class="btn ghost" id="cNo">Keep going</button><button class="btn" id="cYes">Finish and see results</button></div>
</dialog>

<script>
(function(){
'use strict';
// ---------- settings ----------
var SITE = 'd365microsoft.wordpress.com';
var QUESTIONS_PER_QUIZ = 30;
var TIME_LIMIT_MIN = 60;
var API = 'https://public-api.wordpress.com/wp/v2/sites/' + SITE + '/pages';

// WordPress.com app (developer.wordpress.com/apps) used only by the admin form
var CLIENT_ID = '151346';
var REDIRECT = 'https://sara2407.github.io/dynamics-lab-quiz/';
var TOKEN_KEY = 'dl-quiz-admin-token';

// Back from WordPress.com sign-in: keep the token, go back to the admin form
if (location.hash.indexOf('access_token=') > -1) {
  var h = new URLSearchParams(location.hash.slice(1));
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({t: h.get('access_token'), exp: Date.now() + (parseInt(h.get('expires_in')||'1209600',10)*1000) - 60000})); } catch(e) {}
  history.replaceState(null, '', location.pathname + '?admin=1&exam=' + encodeURIComponent((h.get('state')||'').replace(/[^a-z0-9-]/gi,'')));
} else if (location.hash.indexOf('error=') > -1) {
  history.replaceState(null, '', location.pathname + '?admin=1');
}

var params = new URLSearchParams(location.search);
var exam = (params.get('exam') || '').toLowerCase().replace(/[^a-z0-9-]/g,'');
var app = document.getElementById('app');
var examUrl = 'https://' + SITE + '/learn/' + exam + '/';
var quizUrl = examUrl + 'quiz/';
var mode = ({exam:'exam', practice:'practice'})[params.get('mode')] || null;
var bank = [], state = null, tick = null, filter = 'all';
function key(){ return 'dl-quiz-' + exam + (mode === 'practice' ? '-practice' : ''); }

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function save(){try{localStorage.setItem(key(), JSON.stringify(state));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(key()));}catch(e){return null;}}
function clear(){try{localStorage.removeItem(key());}catch(e){}}
function setUrl(){ history.replaceState(null,'',location.pathname+'?exam='+exam+'&mode='+mode); }

// ---------- read the question bank from the WordPress Quiz page ----------
function getJSON(url){return fetch(url,{credentials:'omit'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}

function parseBank(html){
  var doc = new DOMParser().parseFromString(html,'text/html');
  var out = [];
  doc.querySelectorAll('.dl-qq').forEach(function(g, i){
    var h = g.querySelector('h1,h2,h3,h4,h5,h6');
    var q = h ? h.textContent.trim() : '';
    var opts = Array.prototype.map.call(g.querySelectorAll('li'), function(li){
      return li.textContent.trim().replace(/^[A-Ha-h]\s*[.):]\s*/,'');
    }).filter(Boolean);
    var correct = [], exp = '';
    g.querySelectorAll('p').forEach(function(p){
      var t = p.textContent.trim();
      var m = t.match(/^correct(?:\s+answers?)?\s*[:\-–]\s*(.+)$/i);
      if (m) { (m[1].toUpperCase().match(/\b[A-H]\b/g)||[]).forEach(function(l){ correct.push(l.charCodeAt(0)-65); }); }
      var e = t.match(/^explanation\s*[:\-–]\s*([\s\S]*)$/i);
      if (e) exp = e[1].trim();
    });
    correct = correct.filter(function(c){return c < opts.length;});
    if (q && opts.length >= 2 && correct.length) out.push({id: 'q'+i+'-'+q.length, q:q, o:opts, c:correct.sort(), e:exp});
  });
  return out;
}

function loadBank(){
  return getJSON(API + '?slug=' + encodeURIComponent(exam) + '&_fields=id,title,link').then(function(ex){
    if (!ex.length) throw new Error('exam');
    document.getElementById('title').textContent = ex[0].title.rendered.replace(/<[^>]+>/g,'') + ' practice quiz';
    document.title = ex[0].title.rendered.replace(/<[^>]+>/g,'') + ' Practice Quiz – Dynamics Lab';
    return getJSON(API + '?parent=' + ex[0].id + '&slug=quiz&_fields=content');
  }).then(function(q){
    if (!q.length) throw new Error('quiz');
    return parseBank(q[0].content.rendered);
  });
}

// ---------- quiz flow ----------
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function startNew(m){
  mode = m || mode || 'exam';
  var pick = shuffle(bank).slice(0, QUESTIONS_PER_QUIZ);
  state = {
    mode: mode,
    checked: pick.map(function(){return false;}),
    started: Date.now(),
    ends: Date.now() + TIME_LIMIT_MIN*60000,
    qs: pick.map(function(q){return {id:q.id,q:q.q,o:q.o,c:q.c,e:q.e};}),
    ans: pick.map(function(){return [];}),
    cur: 0, finished: false, timedOut: false, finishedAt: null
  };
  save(); setUrl(); renderQuiz(); window.scrollTo(0,0);
}

// Leaving the page ends the quiz; the next quiz starts from the beginning
function active(){ return state && !state.finished && state.mode !== 'practice' && params.get('admin') !== '1'; }
window.addEventListener('beforeunload', function(e){ if (active()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('pagehide', function(){
  if (active()) { state.finished = true; state.left = true; state.finishedAt = Math.min(Date.now(), state.ends); save(); }
});

function finish(timedOut){
  if (!state || state.finished) return;
  state.finished = true; state.timedOut = !!timedOut; state.finishedAt = Date.now();
  save(); clearInterval(tick); filter='all'; renderResults(); window.scrollTo(0,0);
}

function fmt(ms){ms=Math.max(0,ms);var s=Math.ceil(ms/1000);var m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

function startTimer(){
  clearInterval(tick);
  function upd(){
    var left = state.ends - Date.now();
    var el = document.getElementById('timer');
    if (el){ el.textContent = fmt(left); el.classList.toggle('low', left < 5*60000); }
    if (left <= 0) finish(true);
  }
  upd(); tick = setInterval(upd, 1000);
}

function answered(i){return state.ans[i].length>0;}

function renderQuiz(){
  var i = state.cur, q = state.qs[i], n = state.qs.length;
  var multi = q.c.length > 1;
  var isP = state.mode === 'practice';
  if (isP && !state.checked) state.checked = state.qs.map(function(){return false;});
  var locked = isP && state.checked[i];
  var done = isP ? state.checked.filter(Boolean).length : state.ans.filter(function(a){return a.length;}).length;
  var h = '<div class="bar"><div><div class="qnum">Question '+(i+1)+' of '+n+'</div>'+
    '<div class="progress"><span style="width:'+Math.round(done/n*100)+'%"></span></div></div>'+
    (isP ? '<div class="center"><div class="muted" style="font-size:12px">Mode</div><div class="timer" style="font:700 16px system-ui,sans-serif">📘 Practice</div></div>'
         : '<div class="center"><div class="muted" style="font-size:12px">Time left</div><div class="timer" id="timer">--:--</div></div>')+
    '<button class="btn" id="finishBtn">Finish</button></div>';
  h += '<div class="card"><div class="qtext">'+esc(q.q)+'</div>';
  if (multi) h += '<div class="multi">Choose '+q.c.length+' answers.</div>';
  q.o.forEach(function(o, k){
    var sel = state.ans[i].indexOf(k) > -1;
    var fb = locked ? (q.c.indexOf(k) > -1 ? ' right' : (sel ? ' wrong' : '')) : '';
    h += '<label class="opt'+(sel?' sel':'')+fb+'"><input type="'+(multi?'checkbox':'radio')+'" name="o" value="'+k+'"'+(sel?' checked':'')+(locked?' disabled':'')+'>'+
      '<b>'+String.fromCharCode(65+k)+'.</b><span>'+esc(o)+'</span></label>';
  });
  if (isP) {
    if (locked) {
      var ok = isRight(i);
      h += '<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'✓ Correct!':'✗ Not quite.')+'</b>'+(ok?'':' Correct answer: '+q.c.map(function(c){return String.fromCharCode(65+c);}).join(', ')+'.')+
        (q.e?'<div style="margin-top:6px">'+esc(q.e)+'</div>':'')+'</div>';
    } else {
      h += '<button class="btn" id="check" style="margin-top:6px"'+(state.ans[i].length?'':' disabled')+'>Check answer</button>';
    }
  }
  h += '<div class="nav"><button class="btn ghost" id="prev"'+(i===0?' disabled':'')+'>← Previous</button>'+
    (i<n-1 ? '<button class="btn" id="next">Next →</button>' : '<button class="btn" id="fin2">Finish quiz</button>')+'</div>';
  h += '<p class="muted" style="font-size:13px;margin:14px 0 0">'+(isP ? '💾 Your progress is saved – you can leave and continue later.' : '⚠️ If you leave or refresh this page, the quiz ends and you will need to start a new one.')+'</p>';
  h += '<div class="gridwrap"><button class="arrow" id="gl" aria-label="Scroll left">‹</button><div class="grid" id="grid">'+state.qs.map(function(_,k){var st = (isP && state.checked[k]) ? (isRight(k)?'ok ':'no ') : (answered(k)?'done ':''); return '<button data-k="'+k+'" class="'+st+(k===i?'cur':'')+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>';}).join('')+'</div><button class="arrow" id="gr" aria-label="Scroll right">›</button></div></div>';
  app.innerHTML = h;

  app.querySelectorAll('input[name=o]').forEach(function(inp){
    inp.addEventListener('change', function(){
      if (locked) return;
      var picked = Array.prototype.filter.call(app.querySelectorAll('input[name=o]'), function(x){return x.checked;}).map(function(x){return +x.value;});
      state.ans[i] = picked; save(); renderQuiz();
    });
  });
  var go = function(k){state.cur=k;save();renderQuiz();window.scrollTo(0,0);};
  var chk = document.getElementById('check'); if (chk) chk.onclick = function(){ state.checked[i] = true; save(); renderQuiz(); };
  var prev=document.getElementById('prev'); if(prev) prev.onclick=function(){go(i-1);};
  var next=document.getElementById('next'); if(next) next.onclick=function(){go(i+1);};
  app.querySelectorAll('.grid button').forEach(function(b){b.onclick=function(){go(+b.dataset.k);};});
  var grid = document.getElementById('grid'), gl = document.getElementById('gl'), gr = document.getElementById('gr');
  var arrows = function(){ gl.disabled = grid.scrollLeft <= 2; gr.disabled = grid.scrollLeft + grid.clientWidth >= grid.scrollWidth - 2; };
  var cb = grid.children[i]; grid.style.scrollBehavior = 'auto';
  grid.scrollLeft = Math.max(0, cb.offsetLeft - grid.offsetLeft - (grid.clientWidth - cb.offsetWidth) / 2);
  grid.style.scrollBehavior = ''; arrows();
  grid.addEventListener('scroll', arrows);
  gl.onclick = function(){ grid.scrollBy({left: -grid.clientWidth * 0.8}); };
  gr.onclick = function(){ grid.scrollBy({left: grid.clientWidth * 0.8}); };
  var ask=function(){
    var left = n - (isP ? state.checked.filter(Boolean).length : state.ans.filter(function(a){return a.length;}).length);
    document.getElementById('confirmText').textContent = left ? ('You have '+left+' '+(isP?'unchecked':'unanswered')+' question'+(left>1?'s':'')+'. They count as incorrect.') : 'You have answered all questions.';
    document.getElementById('confirm').showModal();
  };
  document.getElementById('finishBtn').onclick=ask;
  var f2=document.getElementById('fin2'); if(f2) f2.onclick=ask;
  if (isP) clearInterval(tick); else startTimer();
}

function isRight(k){var a=state.ans[k].slice().sort(),c=state.qs[k].c;return a.length===c.length&&a.every(function(v,j){return v===c[j];});}

function renderResults(){
  var n = state.qs.length, right = 0;
  for (var k=0;k<n;k++) if (isRight(k)) right++;
  var pct = n ? Math.round(right/n*100) : 0;
  var used = Math.min(state.finishedAt, state.ends) - state.started;
  var col = pct>=70 ? 'var(--ok)' : 'var(--bad)';
  var h = '<div class="card"><div class="score">'+
    '<div class="ring" style="background:conic-gradient('+col+' '+pct*3.6+'deg,#e7edf5 0)"><span>'+pct+'%</span></div>'+
    '<div><h2 style="margin:0 0 6px">'+(state.timedOut?'⏰ Time is up':(state.left?'🚪 Quiz ended – you left the quiz':(state.mode==='practice'?'Practice finished':'Quiz finished')))+'</h2>'+
    '<div><span class="pill ok">✓ '+right+' correct</span> <span class="pill bad">✗ '+(n-right)+' incorrect</span></div>'+
    '<p class="muted" style="margin:10px 0 0">'+right+' of '+n+' questions correct'+(state.mode==='practice'?' · 📘 Practice mode':' · 🎯 Exam mode · time used '+fmt(used))+'</p></div></div>'+
    '<div class="nav" style="justify-content:flex-start"><button class="btn" id="again">Start a new '+(state.mode==='practice'?'practice':'exam')+'</button>'+
    '<button class="btn ghost" id="other">Try '+(state.mode==='practice'?'🎯 Exam':'📘 Practice')+' mode</button><a class="btn ghost" href="'+quizUrl+'">Back to '+esc(exam.toUpperCase())+'</a></div>'+
    '<div class="note">ℹ️ This quiz is only for checking your knowledge level. The questions are not taken from the real exam.</div></div>';
  h += '<div class="tabs" role="tablist">'+
    ['all','right','wrong'].map(function(f){var lbl={all:'All ('+n+')',right:'Correct ('+right+')',wrong:'Incorrect ('+(n-right)+')'}[f];return '<button data-f="'+f+'" class="'+(filter===f?'on':'')+'">'+lbl+'</button>';}).join('')+'</div>';
  state.qs.forEach(function(q,k){
    var ok = isRight(k);
    if (filter==='right' && !ok) return; if (filter==='wrong' && ok) return;
    h += '<div class="res'+(ok?'':' bad')+'"><span class="pill '+(ok?'ok':'bad')+'">'+(ok?'✓ Correct':(state.ans[k].length?'✗ Incorrect':'✗ Not answered'))+'</span>'+
      '<h3>'+(k+1)+'. '+esc(q.q)+'</h3><ul>';
    q.o.forEach(function(o,j){
      var isC=q.c.indexOf(j)>-1, isA=state.ans[k].indexOf(j)>-1;
      var cls = isC ? 'right' : (isA ? 'wrong' : '');
      h += '<li class="'+cls+'">'+String.fromCharCode(65+j)+'. '+esc(o)+(isA?' — your answer':'')+(isC?' ✓':'')+'</li>';
    });
    h += '</ul>'+(q.e?'<div class="exp"><b>Explanation:</b> '+esc(q.e)+'</div>':'')+'</div>';
  });
  app.innerHTML = h;
  app.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){filter=b.dataset.f;renderResults();};});
  document.getElementById('again').onclick=function(){clear();state=null;startNew(mode);};
  document.getElementById('other').onclick=function(){var m = mode==='practice'?'exam':'practice'; mode=m; var sv=load(); if (sv && !sv.finished && m==='practice') { state=sv; setUrl(); renderQuiz(); } else { clear(); state=null; startNew(m); } };
}

function renderIntro(){
  var n = Math.min(QUESTIONS_PER_QUIZ, bank.length);
  app.innerHTML = '<div class="card"><h2 style="margin-top:0">Choose how you want to practice</h2>'+
    '<div class="modes">'+
    '<div class="mode"><h3>🎯 Exam mode</h3><ul class="facts"><li>📝 '+n+' random questions</li><li>⏱️ '+TIME_LIMIT_MIN+' minutes</li><li>📊 Results at the end</li></ul>'+
    '<p class="muted">Like the real exam. The timer starts when you click Start. When the time runs out, or if you leave this page, the quiz ends and you see your results.</p>'+
    '<button class="btn" id="goExam">Start exam mode</button></div>'+
    '<div class="mode"><h3>📘 Practice mode</h3><ul class="facts"><li>📝 '+n+' random questions</li><li>♾️ No timer</li><li>✅ Answer after each question</li></ul>'+
    '<p class="muted">Learn at your own pace. Check each answer and read the explanation. Your progress is saved, so you can leave and continue later.</p>'+
    '<button class="btn ghost" id="goPractice">Start practice mode</button></div>'+
    '</div><div class="note">ℹ️ This quiz is only for checking your knowledge level. The questions are not taken from the real exam.</div></div>';
  document.getElementById('goExam').onclick=function(){ mode='exam'; clear(); startNew('exam'); };
  document.getElementById('goPractice').onclick=function(){ mode='practice'; var sv=load(); if (sv && !sv.finished) { state=sv; setUrl(); renderQuiz(); } else { clear(); startNew('practice'); } };
}

document.getElementById('cNo').onclick=function(){document.getElementById('confirm').close();};
document.getElementById('cYes').onclick=function(){document.getElementById('confirm').close();finish(false);};

// ---------- admin: add questions ----------
function getToken(){try{var t=JSON.parse(localStorage.getItem(TOKEN_KEY));if(t&&t.t&&t.exp>Date.now())return t.t;}catch(e){}return null;}
var DRAFT_KEY = 'dl-quiz-admin-draft';
function saveDraft(){
  var f = document.getElementById('fQ'); if (!f) return;
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({q:f.value, e:document.getElementById('fE').value,
    a:Array.prototype.map.call(document.querySelectorAll('.fA'),function(x){return x.value;}),
    c:Array.prototype.map.call(document.querySelectorAll('.fC'),function(x){return x.checked;})})); } catch(e) {}
}
function restoreDraft(){
  try { var d = JSON.parse(sessionStorage.getItem(DRAFT_KEY)); sessionStorage.removeItem(DRAFT_KEY); if (!d) return;
    document.getElementById('fQ').value = d.q||''; document.getElementById('fE').value = d.e||'';
    document.querySelectorAll('.fA').forEach(function(x,i){x.value=(d.a||[])[i]||'';});
    document.querySelectorAll('.fC').forEach(function(x,i){x.checked=!!(d.c||[])[i];});
  } catch(e) {}
}
function signIn(ex){
  saveDraft();
  location.href = 'https://public-api.wordpress.com/oauth2/authorize?client_id=' + encodeURIComponent(CLIENT_ID) +
    '&redirect_uri=' + encodeURIComponent(REDIRECT) + '&response_type=token&blog=257643930&state=' + encodeURIComponent(ex||'');
}
function signOut(){try{localStorage.removeItem(TOKEN_KEY);}catch(e){} renderAdmin();}
function authFetch(url, opts){
  opts = opts || {}; opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + getToken();
  return fetch(url, opts).then(function(r){
    if (r.status === 401 || r.status === 403) { try{localStorage.removeItem(TOKEN_KEY);}catch(e){} throw new Error(r.status === 403 ? 'site' : 'auth'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
function blockEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/--/g,'&#45;&#45;');}
function questionMarkup(q, opts, correct, exp){
  var li = opts.map(function(o,i){return '<!-- wp:list-item -->\n<li>'+String.fromCharCode(65+i)+'. '+blockEsc(o)+'</li>\n<!-- /wp:list-item -->';}).join('\n\n');
  return '\n\n<!-- wp:group {"className":"dl-qq","layout":{"type":"constrained"}} -->\n<div class="wp-block-group dl-qq"><!-- wp:heading {"level":3} -->\n<h3 class="wp-block-heading">'+blockEsc(q)+'</h3>\n<!-- /wp:heading -->\n\n'+
    '<!-- wp:list -->\n<ul class="wp-block-list">'+li+'</ul>\n<!-- /wp:list -->\n\n'+
    '<!-- wp:paragraph -->\n<p>Correct: '+correct+'</p>\n<!-- /wp:paragraph -->\n\n'+
    '<!-- wp:paragraph -->\n<p>Explanation: '+blockEsc(exp||'')+'</p>\n<!-- /wp:paragraph --></div>\n<!-- /wp:group -->';
}
// Put the new question at the end of the "Question bank" group
function insertIntoBank(raw, markup){
  var start = raw.indexOf('"className":"dl-quiz-bank"');
  if (start < 0) throw new Error('nobank');
  start = raw.lastIndexOf('<!--', start);
  var re = /<!--\s+(\/)?wp:[a-z0-9\/-]+(?:\s+\{[\s\S]*?\})?\s+(\/)?-->/g; re.lastIndex = start;
  var depth = 0, m;
  while ((m = re.exec(raw))) {
    if (m[2]) continue;           // self-closing block
    if (m[1]) { depth--; if (depth === 0) { var close = raw.lastIndexOf('</div>', m.index); return raw.slice(0, close) + markup + '\n' + raw.slice(close); } }
    else depth++;
  }
  throw new Error('nobank');
}
function findQuizPage(ex){
  return getJSON(API + '?slug=' + encodeURIComponent(ex) + '&_fields=id,title').then(function(e){
    if (!e.length) throw new Error('exam');
    return getJSON(API + '?parent=' + e[0].id + '&slug=quiz&_fields=id,content').then(function(q){
      if (!q.length) throw new Error('quiz');
      return {id: q[0].id, bank: parseBank(q[0].content.rendered)};
    });
  });
}

function renderAdmin(){
  document.title = 'Add quiz questions – Dynamics Lab';
  document.getElementById('title').textContent = 'Add quiz questions';
  document.getElementById('crumbExam').textContent = 'Quiz questions';
  var token = getToken();
  var h = '<div class="card">';
  if (!token) {
    h += '<h2 style="margin-top:0">Sign in to add questions</h2><p class="muted">Only the site administrator can add questions. Sign in with your WordPress.com account. Under “Authorize access for” choose <b>d365microsoft.wordpress.com</b> and click <b>Approve</b>.</p>'+
      '<button class="btn" id="signin">Sign in with WordPress.com</button></div>';
    app.innerHTML = h; document.getElementById('signin').onclick = function(){ signIn(exam); }; return;
  }
  h += '<div class="nav" style="margin-top:0;align-items:center"><h2 style="margin:0">New question</h2><button class="btn ghost" id="signout" style="padding:6px 14px;font-size:13px">Sign out</button></div>'+
    '<form id="qf" class="adm">'+
    '<label>Exam<select id="fExam" required><option value="">Loading…</option></select></label>'+
    '<label>Question<textarea id="fQ" rows="3" required placeholder="Write the question here?"></textarea></label>'+
    '<div class="lbl">Answers <span class="muted">(tick the correct answer – tick two for “Choose two”)</span></div>';
  for (var i=0;i<4;i++) h += '<div class="ans"><label class="ck" title="Correct answer"><input type="checkbox" class="fC" value="'+i+'"> correct</label><b>'+String.fromCharCode(65+i)+'.</b><input type="text" class="fA" required placeholder="Answer '+String.fromCharCode(65+i)+'"></div>';
  h += '<label>Explanation <span class="muted">(shown in the results)</span><textarea id="fE" rows="2" placeholder="Why this answer is correct."></textarea></label>'+
    '<div id="msg"></div><button class="btn" id="saveBtn" type="submit">Save question</button></form></div>'+
    '<div class="card" style="margin-top:18px"><div class="nav" style="margin-top:0;align-items:center"><h2 style="margin:0" id="listTitle">Questions</h2><a class="muted" id="editLink" target="_blank" rel="noopener" href="#">Open in WordPress editor ↗</a></div>'+
    '<input type="search" id="fSearch" placeholder="Search questions…" class="srch"><div id="qlist" class="muted">Choose an exam.</div></div>';
  app.innerHTML = h;
  restoreDraft();
  document.getElementById('signout').onclick = signOut;

  var sel = document.getElementById('fExam'), current = null;
  getJSON(API + '?slug=learn&parent=0&_fields=id').then(function(hub){
    return getJSON(API + '?parent=' + hub[0].id + '&per_page=100&orderby=title&order=asc&_fields=slug,title');
  }).then(function(list){
    list = list.filter(function(e){return /^[a-z]{2,3}-\d+/i.test(e.slug);});
    sel.innerHTML = '<option value="">Choose an exam…</option>' + list.map(function(e){return '<option value="'+esc(e.slug)+'">'+esc(e.title.rendered.replace(/<[^>]+>/g,''))+'</option>';}).join('');
    if (exam) sel.value = exam;
    loadList();
  });
  sel.onchange = function(){ exam = sel.value; history.replaceState(null,'',location.pathname+'?admin=1&exam='+exam); loadList(); };

  function loadList(){
    var ex = sel.value, box = document.getElementById('qlist');
    if (!ex) { box.textContent = 'Choose an exam.'; current = null; return; }
    box.textContent = 'Loading…';
    findQuizPage(ex).then(function(p){
      current = p;
      document.getElementById('editLink').href = 'https://' + SITE + '/wp-admin/post.php?post=' + p.id + '&action=edit';
      drawList();
    }).catch(function(){ box.textContent = 'This exam has no Quiz page yet.'; current = null; });
  }
  function drawList(){
    var box = document.getElementById('qlist'), s = document.getElementById('fSearch').value.toLowerCase();
    document.getElementById('listTitle').textContent = sel.value.toUpperCase() + ' – ' + current.bank.length + ' questions';
    var items = current.bank.map(function(q,i){return {q:q,i:i};}).filter(function(x){return !s || x.q.q.toLowerCase().indexOf(s) > -1;});
    box.innerHTML = items.length ? '<ol class="qlist">' + items.map(function(x){
      return '<li value="'+(x.i+1)+'"><b>'+esc(x.q.q)+'</b><br><span class="muted">Correct: '+x.q.c.map(function(c){return String.fromCharCode(65+c)+'. '+esc(x.q.o[c]);}).join(' · ')+'</span></li>';
    }).join('') + '</ol>' : 'No questions found.';
  }
  document.getElementById('fSearch').oninput = function(){ if (current) drawList(); };

  document.getElementById('qf').onsubmit = function(ev){
    ev.preventDefault();
    var msg = document.getElementById('msg');
    var q = document.getElementById('fQ').value.trim();
    var opts = Array.prototype.map.call(document.querySelectorAll('.fA'), function(x){return x.value.trim();});
    var corr = Array.prototype.filter.call(document.querySelectorAll('.fC'), function(x){return x.checked;}).map(function(x){return String.fromCharCode(65 + +x.value);});
    var ex = sel.value;
    if (!ex) { msg.innerHTML = '<p class="err">Choose an exam.</p>'; return; }
    if (!q || opts.some(function(o){return !o;})) { msg.innerHTML = '<p class="err">Fill in the question and all 4 answers.</p>'; return; }
    if (!corr.length) { msg.innerHTML = '<p class="err">Tick the correct answer.</p>'; return; }
    var btn = document.getElementById('saveBtn'); btn.disabled = true; msg.innerHTML = '<p class="muted">Saving…</p>';
    var markup = questionMarkup(q, opts, corr.join(', '), document.getElementById('fE').value.trim());
    findQuizPage(ex).then(function(p){
      var url = 'https://public-api.wordpress.com/wp/v2/sites/' + SITE + '/pages/' + p.id;
      return authFetch(url + '?context=edit&_fields=content').then(function(d){
        var raw = d.content.raw;
        return authFetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content: insertIntoBank(raw, markup)})});
      });
    }).then(function(){
      msg.innerHTML = '<p class="ok">✓ Saved to ' + esc(ex.toUpperCase()) + '. It will appear in the next quizzes for this exam.</p>';
      document.getElementById('qf').reset(); sel.value = ex; btn.disabled = false; loadList();
      document.getElementById('fQ').focus();
    }).catch(function(e){
      btn.disabled = false;
      if (e.message === 'auth') { msg.innerHTML = '<p class="err">Your sign-in has expired. <a href="#" id="re">Sign in again</a> (the question is kept in the form).</p>'; document.getElementById('re').onclick=function(ev){ev.preventDefault(); signIn(ex);}; }
      else if (e.message === 'site') { msg.innerHTML = '<p class="err">You signed in for a different site. <a href="#" id="re">Sign in again</a> and under “Authorize access for” choose <b>d365microsoft.wordpress.com</b>.</p>'; document.getElementById('re').onclick=function(ev){ev.preventDefault(); signIn(ex);}; }
      else if (e.message === 'nobank') msg.innerHTML = '<p class="err">The Quiz page of this exam has no “Question bank” section.</p>';
      else msg.innerHTML = '<p class="err">Saving failed (' + esc(e.message) + '). Please try again.</p>';
    });
  };
}

// ---------- start ----------
document.getElementById('crumbExam').textContent = exam ? exam.toUpperCase() : 'Exam';
document.getElementById('crumbExam').href = examUrl;
document.getElementById('backTop').href = quizUrl;

if (params.get('admin') === '1') { if (!exam) { document.getElementById('backTop').href = 'https://' + SITE + '/manage-exams/'; } renderAdmin(); return; }

if (!exam) { app.innerHTML = '<div class="err">No exam selected. <a href="https://'+SITE+'/learn/">Choose an exam</a>.</div>'; return; }

loadBank().then(function(b){
  bank = b;
  var wantsNew = params.get('start') === '1';
  if (!mode && wantsNew) mode = 'exam';
  if (!bank.length) { app.innerHTML = '<div class="card center"><h2>Coming soon</h2><p class="muted">There are no quiz questions for this exam yet. Please check back later.</p><a class="btn ghost" href="'+quizUrl+'">Back</a></div>'; return; }
  if (!mode) { renderIntro(); return; }
  var saved = load();
  if (saved && saved.finished && wantsNew) { clear(); saved = null; }
  if (saved && saved.qs && saved.qs.length) {
    state = saved; state.mode = state.mode || mode; setUrl();
    if (state.finished) { renderResults(); return; }
    if (state.mode !== 'practice' && Date.now() >= state.ends) { finish(true); return; }
    renderQuiz(); return;
  }
  if (wantsNew) startNew(mode); else renderIntro();
}).catch(function(){
  app.innerHTML = '<div class="err">The quiz could not be loaded. Please refresh the page or try again later. <a href="'+quizUrl+'">Back to the exam</a></div>';
});
})();
</script>
